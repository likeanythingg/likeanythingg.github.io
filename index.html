
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 3px solid white;
            max-width: 95vw;
            max-height: 90vh;
        }
    </style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird, pipes, score, frame, gameOver;

function reset() {
    bird = { x: 80, y: 250, velocity: 0 };
    pipes = [];
    score = 0;
    frame = 0;
    gameOver = false;
}

reset();

function flap() {
    if (gameOver) {
        reset();
        return;
    }
    bird.velocity = -6;
}

document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    flap();
}, { passive: false });

function drawBird() {
    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(bird.x + 5, bird.y - 4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.arc(bird.x + 7, bird.y - 4, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ff922b";
    ctx.beginPath();
    ctx.moveTo(bird.x + 12, bird.y);
    ctx.lineTo(bird.x + 23, bird.y + 4);
    ctx.lineTo(bird.x + 12, bird.y + 7);
    ctx.fill();
}

function endGame() {
    gameOver = true;
}

function update() {
    if (!gameOver) {
        frame++;

        bird.velocity += 0.3;
        bird.y += bird.velocity;

        if (frame % 95 === 0) {
            const gap = 155;
            const top = Math.random() * 260 + 40;
            pipes.push({
                x: canvas.width,
                top,
                bottom: top + gap,
                scored: false
            });
        }

        pipes.forEach(pipe => {
            pipe.x -= 2.5;

            if (!pipe.scored && pipe.x + 55 < bird.x) {
                score++;
                pipe.scored = true;
            }

            const hitPipe =
                bird.x + 12 > pipe.x &&
                bird.x - 12 < pipe.x + 55 &&
                (bird.y - 12 < pipe.top ||
                 bird.y + 12 > pipe.bottom);

            if (hitPipe) endGame();
        });

        pipes = pipes.filter(pipe => pipe.x > -60);

        if (bird.y - 14 < 0 || bird.y + 14 > canvas.height) {
            endGame();
        }
    }
}

function draw() {
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Clouds
    ctx.fillStyle = "rgba(255,255,255,0.65)";
    [[65, 100], [280, 170], [190, 55]].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.arc(x + 20, y - 8, 23, 0, Math.PI * 2);
        ctx.arc(x + 42, y, 16, 0, Math.PI * 2);
        ctx.fill();
    });

    // Pipes
    pipes.forEach(pipe => {
        ctx.fillStyle = "#58b947";
        ctx.fillRect(pipe.x, 0, 55, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, 55,
            canvas.height - pipe.bottom);

        ctx.fillStyle = "#39852e";
        ctx.fillRect(pipe.x - 4, pipe.top - 18, 63, 18);
        ctx.fillRect(pipe.x - 4, pipe.bottom, 63, 18);
    });

    drawBird();

    ctx.fillStyle = "white";
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 3;
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.strokeText(score, canvas.width / 2, 50);
    ctx.fillText(score, canvas.width / 2, 50);

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 32px Arial";
        ctx.fillText("Game Over!", 200, 260);
        ctx.font = "20px Arial";
        ctx.fillText("Score: " + score, 200, 300);
        ctx.fillText("Click or press Space", 200, 345);
        ctx.fillText("to restart", 200, 375);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
