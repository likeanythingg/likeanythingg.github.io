
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Ride</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            background: #87ceeb;
            display: block;
            margin: auto;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <h2>Eagle Ride</h2>
    <p>Use ← → to dodge the trees!</p>
    <p>Score: <span id="score">0</span></p>
    <canvas id="game" width="400" height="500"></canvas>
    <p id="message">Press an arrow key to start</p>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");
        const message = document.getElementById("message");

        let eagle, trees, score, playing, dead;

        function reset() {
            eagle = 200;
            trees = [];
            score = 0;
            playing = false;
            dead = false;
            message.textContent = "Press an arrow key to start";
        }

        document.addEventListener("keydown", e => {
            if (["ArrowLeft", "ArrowRight"].includes(e.key))
                e.preventDefault();

            if (dead) reset();

            if (!playing) {
                playing = true;
                message.textContent = "Dodge the trees!";
            }

            if (e.key === "ArrowLeft") eagle -= 25;
            if (e.key === "ArrowRight") eagle += 25;

            eagle = Math.max(30, Math.min(370, eagle));
        });

        function update() {
            if (!playing || dead) return;

            score++;
            scoreText.textContent = Math.floor(score / 10);

            if (Math.random() < 0.035) {
                trees.push({
                    x: Math.random() * 360 + 20,
                    y: -30,
                    size: 20
                });
            }

            trees.forEach(tree => {
                tree.y += 3 + score / 500;
                tree.size += 0.08;

                if (Math.abs(tree.x - eagle) < tree.size + 8 &&
                    Math.abs(tree.y - 400) < tree.size + 12) {
                    dead = true;
                    message.textContent =
                        "You crashed! Press any key to restart.";
                }
            });

            trees = trees.filter(tree => tree.y < 550);
        }

        function draw() {
            ctx.fillStyle = "#87ceeb";
            ctx.fillRect(0, 0, 400, 500);

            // Forest
            ctx.fillStyle = "#398044";
            ctx.fillRect(0, 0, 35, 500);
            ctx.fillRect(365, 0, 35, 500);

            // Trees coming toward you
            trees.forEach(tree => {
                ctx.fillStyle = "#754321";
                ctx.fillRect(tree.x - 4, tree.y, 8, tree.size);

                ctx.fillStyle = "#176b35";
                ctx.beginPath();
                ctx.moveTo(tree.x, tree.y - tree.size);
                ctx.lineTo(tree.x - tree.size, tree.y + tree.size);
                ctx.lineTo(tree.x + tree.size, tree.y + tree.size);
                ctx.fill();
            });

            // Eagle
            ctx.font = "36px Arial";
            ctx.textAlign = "center";
            ctx.fillText("🦅", eagle, 410);

            if (dead) {
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(0, 0, 400, 500);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.fillText("CRASH!", 200, 230);
                ctx.font = "18px Arial";
                ctx.fillText("Score: " + Math.floor(score / 10), 200, 265);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        reset();
        loop();
    </script>
</body>
</html>
